name: CI/CD

# CI: every push and pull request runs the tests.
# CD: only a manual run (Actions -> CI/CD -> Run workflow, any branch) deploys that commit to the ai-tools host,
# next to ai-trns: the binary /home/archive-stt/bin/archive-stt (linux/amd64, built here), settings
# /home/archive-stt/archive-stt.env (written here from the repo's secrets and variables), data in
# ARCHIVE_STT_DATA_DIR, systemd unit archive-stt. The first run sets the host up (user, data dir, unit).
# SSH goes through a jump host, as for ai-trns -- secrets DEPLOY_HOST, DEPLOY_JUMP_HOST, DEPLOY_KNOWN_HOSTS,
# DEPLOY_SSH_KEY (the same values as ai-trns's).
# Settings: secrets ARCHIVE_STT_AI_TRNS_URL, ARCHIVE_STT_AI_TRNS_KEY, ARCHIVE_STT_API_KEYS (name:key,...; empty =
# from the host itself); variables ARCHIVE_STT_DATA_DIR, ARCHIVE_STT_KMEDIA_URL, ARCHIVE_STT_CDN_URL,
# ARCHIVE_STT_PORT.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: go vet ./...

      - run: go test -race -count=1 ./...

  deploy:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    env:
      HOST: deploy
      HOME_DIR: /home/archive-stt
      BIN: /home/archive-stt/bin
      DATA_DIR: ${{ vars.ARCHIVE_STT_DATA_DIR }}
      PORT: ${{ vars.ARCHIVE_STT_PORT }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          JUMP_HOST: ${{ secrets.DEPLOY_JUMP_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy
          printf '%s\n' \
            "Host jump" "  HostName $JUMP_HOST" "  User root" "  IdentityFile ~/.ssh/id_deploy" "  IdentitiesOnly yes" \
            "  LogLevel ERROR" \
            "Host deploy" "  HostName $DEPLOY_HOST" "  User root" "  IdentityFile ~/.ssh/id_deploy" "  IdentitiesOnly yes" \
            "  ProxyJump jump" "  LogLevel ERROR" > ~/.ssh/config

      - name: Set up the host (first run only does anything)
        run: |
          ssh "$HOST" "set -e
            id archive-stt >/dev/null 2>&1 || useradd --system --create-home --home-dir $HOME_DIR --shell /usr/sbin/nologin archive-stt
            mkdir -p $BIN $DATA_DIR && chown archive-stt: $DATA_DIR"

      - name: Settings
        env:
          AI_TRNS_URL: ${{ secrets.ARCHIVE_STT_AI_TRNS_URL }}
          AI_TRNS_KEY: ${{ secrets.ARCHIVE_STT_AI_TRNS_KEY }}
          API_KEYS: ${{ secrets.ARCHIVE_STT_API_KEYS }}
          KMEDIA_URL: ${{ vars.ARCHIVE_STT_KMEDIA_URL }}
          CDN_URL: ${{ vars.ARCHIVE_STT_CDN_URL }}
        run: |
          # through stdin: the keys are not on any command line
          printf '%s\n' \
            "ARCHIVE_STT_AI_TRNS_URL=$AI_TRNS_URL" "ARCHIVE_STT_AI_TRNS_KEY=$AI_TRNS_KEY" \
            "ARCHIVE_STT_SERVER_API_KEYS=$API_KEYS" "ARCHIVE_STT_SERVER_BIND_ADDRESS=:$PORT" \
            "ARCHIVE_STT_DATA_DIR=$DATA_DIR" "ARCHIVE_STT_KMEDIA_URL=$KMEDIA_URL" "ARCHIVE_STT_KMEDIA_CDN_URL=$CDN_URL" \
            | ssh "$HOST" "umask 077 && cat > $HOME_DIR/archive-stt.env && chown archive-stt: $HOME_DIR/archive-stt.env"

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath \
            -ldflags "-s -w -X github.com/Bnei-Baruch/archive-stt/version.PreRelease=${GITHUB_SHA::7}" -o archive-stt .

      - name: Deploy
        run: |
          ts=$(date +%Y%m%d%H%M%S)
          # the running binary is kept; the last 5 of the deploy's own
          ssh "$HOST" "[ ! -f $BIN/archive-stt ] || cp -a $BIN/archive-stt $BIN/archive-stt.bak.ci.$ts; \
            ls -d $BIN/archive-stt.bak.ci.* 2>/dev/null | sort | head -n -5 | xargs -r rm -f"
          rsync -a archive-stt "$HOST:$BIN/archive-stt.new"
          scp scripts/archive-stt.service "$HOST:/etc/systemd/system/archive-stt.service"
          ssh "$HOST" "set -e
            mv $BIN/archive-stt.new $BIN/archive-stt && chown -R archive-stt: $BIN
            echo '${{ github.sha }} ${{ github.ref_name }}' > $BIN/DEPLOYED
            systemctl daemon-reload && systemctl enable -q archive-stt && systemctl restart archive-stt"

      - name: Check
        run: |
          sleep 5
          ssh "$HOST" "systemctl is-active archive-stt && curl -sf localhost:$PORT/health"
